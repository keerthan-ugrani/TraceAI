[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "traceai"
version = "0.2.0"
description = "ASPICE-oriented engineering digital thread and evidence-grounded AI copilot"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Keerthan Ugrani" }]
dependencies = [
  "pydantic>=2.10,<3",
  "streamlit>=1.41,<2",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
traceai = "traceai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/traceai"]

[tool.hatch.build]
exclude = [
  "/.cache",
  "/.venv",
  "/coverage.xml",
  "/dist",
  "/htmlcov",
  "/outputs",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "integration: tests that exercise multiple application boundaries",
  "verification: acceptance tests mapped to internal PoC software requirements",
]

[tool.coverage.run]
branch = true
source = ["traceai"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B105"]
