name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.12.5"

      - name: Install project
        run: uv sync --extra dev --extra ai --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run static checks
        run: uv run ruff check .

      - name: Run type checks
        run: uv run mypy src/traceai

      - name: Run security checks
        run: uv run bandit -c pyproject.toml -r src/traceai -q

      - name: Run unit and integration tests
        run: uv run pytest --cov=traceai --cov-report=term-missing --cov-report=xml -q

      - name: Run hero requirement smoke test
        run: >-
          uv run traceai trace SWE-REQ-014
          --data data/engineering_data.json
          --output outputs/engineering_intelligence_report.json

      - name: Run six-enhancement offline AI smoke test
        run: >-
          uv run traceai ai suite SWE-REQ-014
          --provider demo
          --output outputs/ai/ci-demo-suite.json

      - name: Build distribution
        run: uv build

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.12.5"
      - run: uv sync --extra dev --extra ai --locked
      - name: Audit dependencies
        run: uv run pip-audit
